# Tender sources. One block per portal.
#
# type: gepnic   -> NIC GePNIC eProcurement portals (etenders.kerala.gov.in,
#                   eprocure.gov.in/eprocure/app, most state portals).
#                   The crawler appends GePNIC page names to base_url.
# type: nprocure -> Gujarat's nProcure portal and its client sites.
# type: epsv2    -> Beltron/mjunction "eProc 2.0" portals (Bihar): base_url is the open-area tender listing page;
#                   the crawler reads the same JSON API that page uses. Needs extra_ca_certs (see certs/README.md).
#
# fetch_details: also open each new tender's detail page (value, category,
#                location...). Costs ~1 request per new tender; capped by
#                max_detail_fetches per run so a bad day can't stall the crawl.
#
# refresh_after_hours: (default 48) an organisation is re-listed at most this often; it is
#                skipped without any request if its listing is fresh, the portal's tender count
#                equals our stored active count, and no tender needs details.
# detail_max_age_days: (default 14) a tender's detail page is fetched when it is new, when its
#                listing changed (closing date, title, ...), or - as a safety net - when older than this.
# detail_workers: detail pages fetched at once (default 1, max 8). The request rate is still capped at
#                1/delay_seconds per source, so extra workers only overlap the portal's response time.
# ignore_robots: true skips the portal's robots.txt. Set per portal on purpose: gujarat has no real rules;
#                maharashtra publishes 'Disallow: /' and the owner decided to crawl it anyway.
#                Flip a source back to false when its robots.txt starts to matter.
#
# Add a new GePNIC state by copying a block and changing slug/name/base_url.

sources:
  - slug: kerala
    name: Kerala eTenders
    type: gepnic
    base_url: https://etenders.kerala.gov.in/nicgep/app
    enabled: true
    fetch_details: true
    max_detail_fetches: 8000
    refresh_after_hours: 48   # re-list an organisation at most this often
    detail_max_age_days: 14   # safety net: re-fetch a tender's details if older than this (0 = never)
    delay_seconds: 1.0
    detail_workers: 2

  - slug: gujarat
    name: Gujarat eProcurement (nProcure)
    type: nprocure
    base_url: https://tender.nprocure.com
    enabled: true
    ignore_robots: true
    extra_ca_certs: certs/sectigo-ov-r36.pem
    fetch_details: true
    max_detail_fetches: 6000
    refresh_after_hours: 48
    detail_max_age_days: 14
    detail_workers: 2
    delay_seconds: 2.0


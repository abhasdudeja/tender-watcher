name: Crawl tenders

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours (UTC). GitHub may delay by minutes.
  workflow_dispatch:
    inputs:
      limit_orgs:
        description: "Only first N organisations (smoke test)"
        required: false
        default: ""
      no_details:
        description: "Skip tender detail pages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit_orgs }}" ]; then ARGS="$ARGS --limit-orgs ${{ github.event.inputs.limit_orgs }}"; fi
          if [ "${{ github.event.inputs.no_details }}" = "true" ]; then ARGS="$ARGS --no-details"; fi
          python -m crawler.run $ARGS || echo "crawler exited non-zero; committing whatever was gathered"

      - name: Commit data
        run: |
          git config user.name  "tenderwatch-bot"
          git config user.email "tenderwatch-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            ACTIVE=$(python -c "import json;print(len(json.load(open('docs/data/index.json'))['tenders']))")
            git commit -m "crawl: $(date -u +%Y-%m-%dT%H:%MZ) - $ACTIVE active tenders"
            git push
          fi
